<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-labelledby="title desc">
  <title id="title">Section divider</title>
  <desc id="desc">A thin neon divider line for the TakuLabs profile.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1200" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="0.82" stop-color="#34d399"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="36" fill="#05070d"/>
  <line x1="80" y1="18" x2="1120" y2="18" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="248" cy="18" r="3" fill="#22d3ee"/>
  <circle cx="600" cy="18" r="4" fill="#a78bfa"/>
  <circle cx="952" cy="18" r="3" fill="#34d399"/>
</svg>
