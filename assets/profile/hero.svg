<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">TakuLabs profile hero</title>
  <desc id="desc">TakuLabs profile hero for Java backend and Minecraft systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.56" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#071316"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" x2="1010" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#243044" stroke-width="1" opacity="0.24"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: Consolas, Menlo, monospace; }
      .sans { font-family: Segoe UI, Arial, Helvetica, sans-serif; }
      .muted { fill: #a7b0c0; }
      .white { fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <circle cx="1016" cy="82" r="130" fill="#a78bfa" opacity="0.08"/>
  <circle cx="184" cy="316" r="116" fill="#22d3ee" opacity="0.08"/>

  <rect x="126" y="74" width="948" height="232" rx="18" fill="#08111d" opacity="0.54" stroke="#243044"/>

  <text x="600" y="164" text-anchor="middle" class="sans white" font-size="78" font-weight="800" letter-spacing="6">TAKULABS</text>
  <text x="600" y="209" text-anchor="middle" class="mono" font-size="22" fill="url(#accent)">Java · Backend · Minecraft Systems</text>
  <text x="600" y="250" text-anchor="middle" class="sans muted" font-size="18">Server systems, plugin architecture, backend integrations and developer tooling.</text>

  <rect x="126" y="74" width="948" height="232" rx="18" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.52">
    <animate attributeName="opacity" values="0.34;0.58;0.34" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
