<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TakuLabs profile hero</title>
  <desc id="desc">TakuLabs brand hero for Minecraft systems and backend development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.5" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#071315"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" x2="1040" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#243044" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .quiet { fill: #9ca3af; }
      .white { fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="970" cy="92" r="170" fill="url(#pulse)"/>
  <circle cx="236" cy="330" r="145" fill="#22d3ee" opacity="0.08"/>

  <path d="M122 314C248 222 326 270 432 180C548 80 670 112 770 160C884 214 990 172 1082 86" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.55" filter="url(#softGlow)"/>
  <path d="M132 102H342L388 148H526L586 208H812L858 254H1068" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M132 102H342L388 148H526L586 208H812L858 254H1068" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.26">
    <animate attributeName="stroke-dasharray" values="0 1200;180 1020;0 1200" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-360;-720" dur="7s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#softGlow)">
    <circle cx="132" cy="102" r="5" fill="#22d3ee"/>
    <circle cx="388" cy="148" r="5" fill="#a78bfa"/>
    <circle cx="586" cy="208" r="5" fill="#f8fafc"/>
    <circle cx="858" cy="254" r="5" fill="#34d399"/>
    <circle cx="1068" cy="254" r="5" fill="#22d3ee"/>
  </g>

  <text x="600" y="170" text-anchor="middle" class="sans white" font-size="86" font-weight="800" letter-spacing="8">TAKULABS</text>
  <text x="600" y="215" text-anchor="middle" class="mono" font-size="22" fill="url(#accent)">Minecraft Systems &amp; Backend Development</text>
  <text x="600" y="260" text-anchor="middle" class="sans quiet" font-size="18">Java plugin architecture, server infrastructure, security systems and developer tooling.</text>

  <g class="mono" font-size="15" text-anchor="middle">
    <rect x="396" y="300" width="408" height="44" rx="8" fill="#0f172a" stroke="#334155" opacity="0.88"/>
    <text x="600" y="328" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0;0;1" dur="12s" repeatCount="indefinite"/>
      Paper API
    </text>
    <text x="600" y="328" fill="#a78bfa" opacity="0">Inventory Systems
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="328" fill="#34d399" opacity="0">Security Tooling
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="328" fill="#f8fafc" opacity="0">Config-Driven Systems
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="9s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
